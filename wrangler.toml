name = "x-store"
compatibility_date = "2026-10-06"
main = "functions/api/[[path]].js"

[assets]
directory = "./dist"
# Name the binding so the Worker can call env.ASSETS.fetch()
binding = "ASSETS"
# Serve 404.html (with a 404 status) for any unknown path
not_found_handling = "404-page"
# Worker must run first so serveAsset() can apply Cache-Control + gzip
# to every component (assets-first would bypass the worker headers).
run_worker_first = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "x-db"
database_id = "c6856b79-41d9-4d12-8c72-430b52b113e3"
migrations_dir = "migrations"

# KV namespace for sessions (optional, for future auth)
[[kv_namespaces]]
binding = "SESSIONS"
id = "5f1026c4058c4b43947a3b70ed830cb2"
preview_id = "cf30aa850df64cda95ae33ee5a880927"

# Environment variables
[vars]
ENVIRONMENT = "development"
ADMIN_EMAIL = "admin@elle.com"

# Development settings
[dev]
ip = "127.0.0.1"
port = 8787

# Production environment (configure via dashboard)
[env.production]
name = "x-store-prod"
compatibility_date = "2026-10-06"

[[env.production.d1_databases]]
binding = "DB"
database_name = "x-db-prod"
database_id = "919f84b1-76e5-4b75-b16e-620a8f50caed"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "7d5b4ef600744cdab36b8a1c21d15295"

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_EMAIL = "admin@elle.com"