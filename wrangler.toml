name = "x-store"
compatibility_date = "2026-10-06"

[assets]
directory = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "x-db"
database_id = "YOUR_DATABASE_ID_HERE"
migrations_dir = "migrations"

# KV namespace for sessions (optional, for future auth)
[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "YOUR_KV_PREVIEW_ID_HERE"

# Environment variables
[vars]
ENVIRONMENT = "development"
ADMIN_EMAIL = "admin@x.com"

# Development settings
[dev]
ip = "127.0.0.1"
port = 8787

# Production environment (configure via dashboard)
[env.production]
name = "x-store-prod"
compatibility_date = "2026-10-06"

[[env.production.d1_databases]]
binding = "DB"
database_name = "x-db-prod"
database_id = "YOUR_PROD_DATABASE_ID_HERE"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_PROD_KV_NAMESPACE_ID_HERE"

[env.production.vars]
ENVIRONMENT = "production"