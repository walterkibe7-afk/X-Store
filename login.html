<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Elle</title>
<meta name="description" content="Log in to your Elle account to access your orders, saved preferences and personal details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="login.css?v=0425f98">
</head>
<body>
<main class="auth-page">
<a href="index.html" class="auth-logo">Elle</a>
<div class="auth-card">
<div class="auth-header">
<span class="eyebrow">WELCOME BACK</span>
<h1>Log in to Elle.</h1>
<p>Access your account, orders and saved preferences.</p>
</div>
<form id="loginForm" novalidate>
<div class="form-group">
<label for="loginEmail">Email address</label>
<input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
</div>
<div class="form-group">
<div class="label-row">
<label for="loginPassword">Password</label>
<a href="#" id="forgotPassword">Forgot password?</a>
</div>
<input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
</div>
<label class="checkbox-row">
<input type="checkbox" id="rememberMe">
<span>Remember me</span>
</label>
<button type="submit" class="auth-button">Log in</button>
<p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
</form>
<div class="auth-divider"><span>OR</span></div>
<p class="switch-auth">Don't have an account? <a href="signup.html">Create one</a></p>
</div>
<a href="index.html" class="back-link">&larr; Back to Elle</a>
</main>
<script src="login.js?v=0425f98"></script>
</body>
</html>
