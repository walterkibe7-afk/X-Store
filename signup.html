<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Elle</title>
<meta name="description" content="Create an Elle account to save your orders, preferences and future purchases in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" media="all">
<link rel="stylesheet" href="signup.css?v=20261020a">
<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://challenges.cloudflare.com/script-le/script.js" async defer></script>
</head>
<body>
<main class="auth-page">
<a href="index.html" class="auth-logo">Elle</a>
<div class="auth-card">
<div class="auth-header">
<span class="eyebrow">JOIN ELLE</span>
<h1>Create your account.</h1>
<p>Save your orders, preferences and future purchases in one place.</p>
</div>
<form id="signupForm" novalidate>
<div class="name-grid">
<div class="form-group">
<label for="firstName">First name</label>
<input type="text" id="firstName" autocomplete="given-name" required>
</div>
<div class="form-group">
<label for="lastName">Last name</label>
<input type="text" id="lastName" autocomplete="family-name" required>
</div>
</div>
<div class="form-group">
<label for="signupEmail">Email address</label>
<input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
</div>
<div class="form-group">
<label for="signupPassword">Password</label>
<input type="password" id="signupPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
</div>
<div class="form-group">
<label for="confirmPassword">Confirm password</label>
<input type="password" id="confirmPassword" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
</div>
<label class="terms-row">
<input type="checkbox" id="terms" required>
<span>I agree to the terms and understand the privacy policy.</span>
</label>
<div class="turnstile-wrapper"><div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstileSuccess"></div></div>
<button type="submit" class="auth-button">Create account</button>
<p class="form-message" id="signupMessage" role="status" aria-live="polite"></p>
</form>

<div class="auth-divider"><span>OR</span></div>

<div id="googleBtnWrapper" class="google-btn-wrapper">
  <div id="googleSignUpContainer" class="google-btn-container"></div>
  <button type="button" class="google-button" id="googleSignUpFallback">
    <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.46 3.04 29.53 1 24 1 14.82 1 7.04 6.48 3.68 14.16l7.14 5.55C12.56 13.34 17.84 9.5 24 9.5z"/><path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.69c-.55 2.99-2.21 5.52-4.7 7.22l7.14 5.55C43.54 37.64 46.52 31.54 46.52 24.5z"/><path fill="#FBBC05" d="M10.82 28.71A14.54 14.54 0 0 1 9.5 24c0-1.64.28-3.23.82-4.71L3.18 13.74A23.01 23.01 0 0 0 1 24c0 3.71.88 7.22 2.68 10.26l7.14-5.55z"/><path fill="#34A853" d="M24 47c5.53 0 10.16-1.83 13.55-4.98l-7.14-5.55C28.6 38.41 26.41 39 24 39c-6.16 0-11.44-3.84-13.18-9.29l-7.14 5.55C7.04 43.52 14.82 47 24 47z"/></svg>
    <span>Continue with Google</span>
  </button>
</div>

<p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
</div>
<a href="index.html" class="back-link">&larr; Back to Elle</a>
</main>
<script src="signup.js?v=20261020a"></script>
</body>
</html>
