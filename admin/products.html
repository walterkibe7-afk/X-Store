<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Products — Elle Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><script src="js/admin.js"></script><script>
let rows = [];
async function init() {
  const ok = await Admin.requireAuth();
  if (!ok) return;
  const body = '<div class="card"><div class="card-b">'
  + '<div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search products..."></div>'
  + '<div class="chips" id="chips"><button class="chip active">All</button><button class="chip">Intimate</button><button class="chip">Wellness</button><button class="chip">Active</button><button class="chip">Inactive</button></div></div>'
  + '<div class="table-wrap"><table class="grid"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Badge</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>'
  + '<div id="emptyBox"></div><div class="pager"><span id="count"></span></div>'
  + '</div></div>'
  + '<div class="modal-back" id="delModal"><div class="modal"><h3>Delete Product?</h3><p id="delName">Are you sure you want to delete this product?</p><div class="modal-actions"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-danger" id="delYes">Delete Product</button></div></div></div>'
  + '<div class="modal-back" id="deModal"><div class="modal"><h3>Deactivate Product?</h3><p>This product will no longer appear in the store.</p><div class="modal-actions"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="deYes">Deactivate</button></div></div></div>';
  Admin.mount('products','Products','Manage your products and catalogue.','<a class="btn btn-primary" href="product-edit.html">+ Add Product</a>', body);
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal-back').classList.remove('open'));
  document.getElementById('q').oninput=()=>render(document.querySelector('.chip.active').textContent);
  document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip.active').forEach(x=>x.classList.remove('active'));c.classList.add('active');render(c.textContent);});
  document.getElementById('deYes').onclick = toggleActive;
  await reload();
}
async function reload() {
  // Cache-busting + no-store is handled inside Admin.apiFetch; the extra
  // timestamp here guarantees a fresh read after a price save even if the
  // browser tries to reuse the /api/products?limit=100 entry.
  const data = await Admin.apiFetch('/api/products?limit=100&_=' + Date.now());
  rows = (data && data.products) ? data.products : [];
  render(document.querySelector('.chip.active') ? document.querySelector('.chip.active').textContent : 'All');
}
function shortDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  catch (e) { return ''; }
}
function render(filter) {
  const tb = document.getElementById('tb'), empty = document.getElementById('emptyBox');
  let list = rows.slice();
  if (filter && filter !== 'All') {
    if (filter==='Active') list = list.filter(r=>r.active);
    else if (filter==='Inactive') list = list.filter(r=>!r.active);
    else list = list.filter(r=>r.category===filter);
  }
  const q = (document.getElementById('q').value||'').toLowerCase();
  if (q) list = list.filter(r=>(r.name||'').toLowerCase().includes(q));
  document.getElementById('count').textContent = list.length + ' product' + (list.length === 1 ? '' : 's');
  if (!list.length) { tb.innerHTML=''; empty.innerHTML='<div class="empty"><div class="empty-ic">+</div><h3>No products found</h3><p>Try a different search or filter.</p></div>'; return; }
  empty.innerHTML='';
  tb.innerHTML = list.map(r=>{
    const cat = Admin.esc(r.category + (r.subcategory ? ' / ' + r.subcategory : ''));
    return '<tr><td><div class="prod-cell">'+Admin.thumb((r.name||'?')[0])+'<div><strong>'+Admin.esc(r.name)+'</strong><span>'+cat+'</span></div></div></td><td>'+cat+'</td><td>'+Admin.money(r.price)+'</td><td>'+(r.active?Admin.pill('Active'):Admin.pill('Inactive'))+'</td><td>'+Admin.badgeTag(r.badge)+'</td><td>'+shortDate(r.updated_at)+'</td><td><div class="kebab"><button class="btn btn-ghost btn-sm">...</button><div class="kebab-menu"><button data-edit="'+Admin.esc(r.id)+'">Edit</button><button data-dup="'+Admin.esc(r.id)+'">Duplicate</button><button data-de="'+Admin.esc(r.id)+'">'+(r.active?'Deactivate':'Activate')+'</button><button class="danger" data-del="'+Admin.esc(r.id)+'">Delete</button></div></div></td></tr>';
  }).join('');
  tb.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>location.href='product-edit.html?id='+encodeURIComponent(b.getAttribute('data-edit')));
  tb.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>duplicateProduct(b.getAttribute('data-dup')));
  tb.querySelectorAll('[data-de]').forEach(b=>{ b.onclick=()=>{ window._pendingId = b.getAttribute('data-de'); document.getElementById('deYes').textContent = b.textContent; document.getElementById('deModal').classList.add('open'); }; });
  tb.querySelectorAll('[data-del]').forEach(b=>{ b.onclick=()=>{ window._pendingId = b.getAttribute('data-del'); document.getElementById('delYes').onclick = deleteProduct; document.getElementById('delModal').classList.add('open'); }; });
  tb.querySelectorAll('.kebab > button').forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentElement.classList.toggle('open');});
}
document.addEventListener('click', () => document.querySelectorAll('.kebab.open').forEach(k => k.classList.remove('open')));
async function toggleActive() {
  const id = window._pendingId;
  document.getElementById('deModal').classList.remove('open');
  const row = rows.find(r=>r.id===id);
  const res = await Admin.apiFetch('/api/products/'+encodeURIComponent(id), { method:'PUT', body: JSON.stringify({ active: row && row.active ? 0 : 1 }) });
  if (res && res.product) { Admin.toast(row && row.active ? 'Product deactivated' : 'Product activated'); await reload(); }
  else Admin.toast('Could not update product');
}
async function deleteProduct() {
  const id = window._pendingId;
  document.getElementById('delModal').classList.remove('open');
  const res = await Admin.apiFetch('/api/products/'+encodeURIComponent(id), { method:'DELETE' });
  if (res && res.success) { Admin.toast('Product removed from store'); await reload(); }
  else Admin.toast('Could not remove product');
}
async function duplicateProduct(id) {
  const src = rows.find(r=>r.id===id);
  if (!src) return;
  const slug = String(src.slug || src.id) + '-copy';
  const res = await Admin.apiFetch('/api/products', { method:'POST', body: JSON.stringify({
    name: src.name + ' Copy', slug: slug, category: src.category, subcategory: src.subcategory,
    price: src.price, compare_price: src.compare_price, description: src.description,
    details: src.details, badge: src.badge, featured: 0, active: 0
  }) });
  if (res && res.product) { Admin.toast('Product duplicated as draft'); await reload(); }
  else Admin.toast('Could not duplicate (slug taken?)');
}
init();
</script></body></html>
