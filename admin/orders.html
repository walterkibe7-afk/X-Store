<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orders — Elle Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><script src="js/admin.js"></script><script>
let rows = [];
let lastSeen = '';
let liveTimer = null;
function payLabel(o) {
  const m = (o.payment_method || 'card').toLowerCase();
  const ref = o.payment_reference ? ' · ' + o.payment_reference : '';
  if (m === 'paybill') return 'Paybill' + ref;
  if (m === 'stk' || m === 'mobile') return 'M-Pesa' + ref;
  return 'Card';
}
function shortDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  catch (e) { return ''; }
}
async function init() {
  const ok = await Admin.requireAuth();
  if (!ok) return;
  const body = '<div class="card"><div class="card-b">'
  +'<div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search orders..."></div>'
  +'<div class="chips" id="chips"><button class="chip active">All</button><button class="chip">Pending</button><button class="chip">Paid</button><button class="chip">Processing</button><button class="chip">Shipped</button><button class="chip">Delivered</button><button class="chip">Cancelled</button></div></div>'
  +'<div class="table-wrap"><table class="grid"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody id="tb"></tbody></table></div><div id="emptyBox"></div>'
  +'</div></div>';
  Admin.mount('orders','Orders','Manage customer orders. <span class="live-dot" id="liveDot" title="Auto-refresh on"></span>', '', body);
  document.getElementById('q').oninput=()=>render(document.querySelector('.chip.active').textContent);
  document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');render(c.textContent);});
  await refresh(true);
  liveTimer = setInterval(()=>refresh(false), 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh(false);
  });
}
async function refresh(first) {
  const data = await Admin.apiFetch('/api/orders?limit=100');
  const next = (data && data.orders) ? data.orders : [];
  if (!first) announceChanges(rows, next);
  rows = next;
  render(document.querySelector('.chip.active') ? document.querySelector('.chip.active').textContent : 'All');
}
function announceChanges(prev, next) {
  const before = {};
  prev.forEach(o=>{ before[o.id] = o.status; });
  next.forEach(o=>{
    if (!before[o.id]) {
      Admin.toast('New order ' + (o.number || o.id));
      flashRow(o.id);
    } else if (before[o.id] !== o.status) {
      Admin.toast('Order ' + (o.number || o.id) + ' is now ' + o.status);
      flashRow(o.id);
    }
  });
}
function flashRow(id) {
  requestAnimationFrame(()=>{
    const el = document.querySelector('tr[data-oid="' + id + '"]');
    if (el) { el.classList.add('row-flash'); setTimeout(()=>el.classList.remove('row-flash'), 2600); }
  });
}
function render(f){
  const tb = document.getElementById('tb'), eb = document.getElementById('emptyBox');
  const q=(document.getElementById('q').value||'').toLowerCase();
  let list = rows.filter(r=>(f==='All'||r.status===f));
  if (q) list = list.filter(r=>String(r.number||'').toLowerCase().includes(q)||String(r.shipping_name||'').toLowerCase().includes(q)||String(r.shipping_email||'').toLowerCase().includes(q));
  if(!list.length){ tb.innerHTML=''; eb.innerHTML='<div class="empty"><div class="empty-ic">#</div><h3>No orders yet</h3><p>Orders will appear here when customers purchase from your store.</p></div>'; return; }
  eb.innerHTML='';
  tb.innerHTML=list.map(r=>'<tr data-oid="'+Admin.esc(r.id)+'"><td><a class="link" href="order-detail.html?id='+encodeURIComponent(r.id)+'"><strong>'+Admin.esc(r.number||r.id)+'</strong></a></td><td>'+Admin.esc(r.shipping_name||r.shipping_email||'—')+'</td><td>'+(r.item_count||0)+'</td><td>$'+Number(r.total||0).toFixed(2)+'</td><td>'+Admin.esc(payLabel(r))+'</td><td>'+Admin.pill(r.status||'pending')+'</td><td>'+shortDate(r.created_at)+'</td></tr>').join('');
}
init();
</script></body></html>
