<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login — Elle</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="login-wrap"><div class="login-card"><div class="login-brand"><b>Elle</b><span>ADMIN</span><p>Welcome back</p></div><form id="f"><div class="f-group"><label class="f-label">Email</label><input class="input" id="e" type="email" placeholder="admin@elle.com" required></div><div class="f-group"><label class="f-label">Password</label><input class="input" id="p" type="password" required></div><button class="btn btn-primary" style="width:100%" type="submit">Sign in</button><p style="text-align:center;margin:14px 0 0"><a class="link" href="#">Forgot password?</a></p><p id="err" class="error" style="display:none;color:#c00;margin-top:12px"></p></form></div></div><script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const email = document.getElementById('e').value.trim();
  const password = document.getElementById('p').value;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Login failed';
      err.style.display = 'block';
      return;
    }
    location.href = 'index.html';
  } catch (e) {
    err.textContent = 'Network error. Please try again.';
    err.style.display = 'block';
  }
};
</script></body></html>
