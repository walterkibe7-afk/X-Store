<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — X</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <main class="login-page">
        <div class="login-card card">
            <div class="login-brand">
                <h1 class="login-brand-text">X</h1>
                <p class="login-brand-subtitle">Admin Panel</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email <span class="required">*</span></label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="admin@x.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="required">*</span></label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <div class="form-group form-checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me for 30 days</label>
                </div>

                <button type="submit" class="btn btn-primary login-submit">Sign In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#">Contact administrator</a></p>
            </div>

            <div class="login-dev-notice">
                <strong>Development Mode</strong><br>
                Use <code>admin@x.com</code> / <code>admin123</code> to sign in.<br>
                This authentication is mocked for Phase 1 development only.
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const remember = document.getElementById("remember").checked;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;

            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            const result = Admin.login(email, password, remember);

            if (result.success) {
                const redirect = new URLSearchParams(window.location.search).get("redirect") || "index.html";
                window.location.href = redirect;
            } else {
                Admin.showToast(result.error, "error");
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        document.getElementById("email").value = "admin@x.com";
        document.getElementById("password").value = "admin123";
    </script>
</body>
</html>
