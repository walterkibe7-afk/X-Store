<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings — X Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><script src="js/admin.js"></script><script>
Admin.requireAuth();
const body='<div class="edit-grid"><div><div class="card"><div class="card-h"><h2>Store</h2></div><div class="card-b"><div class="f-row"><div class="f-group"><label class="f-label">Store Name</label><input class="input" value="X"></div><div class="f-group"><label class="f-label">Store Email</label><input class="input" value="hello@x.com"></div></div><div class="f-row"><div class="f-group"><label class="f-label">Currency</label><select class="select"><option>USD ($)</option><option>KES</option></select></div><div class="f-group"><label class="f-label">Shipping Fee</label><input class="input" value="5"></div></div></div></div>'
+'<div class="card" style="margin-top:16px"><div class="card-h"><h2>Store Defaults</h2></div><div class="card-b"><div class="f-row"><div class="f-group"><label class="f-label">Default shipping fee</label><input class="input" value="5"></div><div class="f-group"><label class="f-label">Default currency</label><select class="select"><option>USD</option></select></div></div></div></div></div>'
+'<div><div class="card"><div class="card-h"><h2>Account</h2></div><div class="card-b"><div class="f-group"><label class="f-label">Admin Profile</label><input class="input" value="Admin"></div><button class="btn btn-secondary" style="width:100%;margin-bottom:10px">Change Password</button><button class="btn btn-ghost" style="width:100%" id="out">Logout</button></div></div></div></div>';
Admin.mount('settings','Settings','Manage store and account preferences.','<button class="btn btn-primary" id="save">Save Changes</button>',body);
document.getElementById('save').onclick=()=>Admin.toast('Settings saved');
document.getElementById('out').onclick=()=>{localStorage.removeItem('xAdminAuth');location.href='login.html';};
</script></body></html>
